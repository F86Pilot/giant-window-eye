# Giant Eye kiosk: an empty taskbar. Raspberry Pi OS still starts the taskbar behind the eye,
# and its plugins pop things up over it (the Wi-Fi plugin's "password required" box when Wi-Fi
# drops, low-power and update notices). With no plugins, nothing can. Delete this file
# (~/.config/wf-panel-pi/wf-panel-pi.ini) to get the normal taskbar back.
[panel]
widgets_left=
widgets_right=
